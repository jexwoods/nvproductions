<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NV Productions | Events, Content & Analytics</title>
<meta name="description" content="Corporate events, weddings and parties, affordable content for small businesses, and data analytics.">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0d0d12; color: #f2f2f5; line-height: 1.6;
}
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
header { padding: 48px 0 0; text-align: center; }
.brand {
  font-size: clamp(2.8rem, 8vw, 5rem); font-weight: 800;
  letter-spacing: 4px; line-height: 1.1;
}
.hero { padding: 60px 0 80px; text-align: center; }
.hero h1 { font-size: clamp(1.8rem, 4.5vw, 3rem); line-height: 1.15; margin-bottom: 20px; }
.hero h1 span {
  background: linear-gradient(90deg, #8b5cf6, #ec4899);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p { font-size: 1.2rem; color: #a1a1b5; max-width: 620px; margin: 0 auto 36px; }
.btn {
  display: inline-block; padding: 14px 32px; border-radius: 999px;
  background: linear-gradient(90deg, #8b5cf6, #ec4899);
  color: #fff; text-decoration: none; font-weight: 600;
}
.btn:hover { opacity: 0.9; }
.services {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 24px; padding: 40px 0 100px;
}
