  <style>

    body {

      background: #0d0d12; color: #f2f2f5; line-height: 1.6;
    }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px; }

    .card p { color: #a1a1b5; }
    .contact { text-align: center; padding: 80px 0; border-top: 1px solid #26263a; }

    .contact p { color: #a1a1b5; margin-bottom: 28px; }
    footer { text-align: center; padding: 30px 0; color: #6b6b80; font-size: 0.9rem; }

</head>
